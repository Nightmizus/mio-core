name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .[dev]
      - run: ruff check mio_core tests
      - run: pytest --cov=mio_core
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - name: Reject committed secrets
        shell: pwsh
        run: |
          $matches = git grep -n -E 'sk-kimi-[A-Za-z0-9_-]{12,}|-----BEGIN (OPENSSH|RSA) PRIVATE KEY-----' -- ':!*.example' ':!README.md'
          if ($LASTEXITCODE -eq 0) { $matches; throw 'Potential secret committed.' }
          if ($LASTEXITCODE -ne 1) { throw 'git grep failed.' }
          exit 0
